services:
  - type: web
    name: chord-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_data"
    startCommand: "gunicorn chord_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard to your Supabase PostgreSQL URI
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.netlify.app,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,https://*.netlify.app"
      - key: PYTHONUNBUFFERED
        value: "1"
