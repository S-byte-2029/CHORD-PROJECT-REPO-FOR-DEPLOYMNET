[build]
  publish = "."
  command = "node -e 'const fs=require(\"fs\"); const url=process.env.VITE_API_URL || process.env.CHORD_API_URL || \"http://127.0.0.1:8000/api\"; fs.writeFileSync(\"env-config.js\", `window.__ENV__ = { VITE_API_URL: \"${url}\" };\\n`);'"

[build.environment]
  NODE_VERSION = "20"

# Redirect rules for SPA routing and Clean HTML page routing
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/land"
  to = "/land.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200

[[redirects]]
  from = "/scheme-details"
  to = "/scheme-details.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/edit-profile"
  to = "/edit-profile.html"
  status = 200

[[redirects]]
  from = "/document-upload"
  to = "/document-upload.html"
  status = 200

[[redirects]]
  from = "/track-applications"
  to = "/track-applications.html"
  status = 200

[[redirects]]
  from = "/view-uploaded-info"
  to = "/view-uploaded-info.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Client-side SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
